
# CONFIGURACIÓN DE BASE DE DATOS MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/levelup_gamer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE HIBERNATE / JPA

# update: Crea o actualiza las tablas automáticamente sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CONFIGURACIÓN DEL SERVIDOR

# Levantamos el backend en el puerto 8080 para que no choque con Vite (5173)
server.port=8080